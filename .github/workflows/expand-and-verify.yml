name: Expand and verify original ReleasePad source
on:
  push:
    paths:
      - source_bundle.py
      - .github/workflows/expand-and-verify.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand reviewed original files
        run: |
          python source_bundle.py --extract /tmp/releasepad-source
          python - <<'PY'
          import pathlib,shutil
          root=pathlib.Path('/tmp/releasepad-source')
          for source in root.rglob('*'):
              if source.is_file():
                  target=pathlib.Path('.')/source.relative_to(root)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(source,target)
          PY
      - run: npm install --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_api -v
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Build container and verify dedicated-volume restart
        run: |
          docker build -t releasepad-ci .
          python test_container.py
      - name: Publish normal source tree after successful checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Expand verified original ReleasePad source'
          git push
